name: Customer service pipeline.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy-to-dev:
        description: 'Deploy branch container to dev environment for testing'
        required: false
        type: boolean
        default: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  variables:
    name: Generate variables
    runs-on: ubuntu-latest
    steps:
    - uses: sming-code/get-version-no-action@v1
      id: get-version
      with:
        major: 1
        minor: 0
    - name: Display done
      run: echo "Variables loaded..."
    outputs:
      project-name-root: DemoApp.Services.Customers
      app-name: customer
      version-no: ${{ steps.get-version.outputs.version-no }}
      last-release-tag: ${{ steps.get-version.outputs.last-release-tag }}
      logical-area: private
      service-name: "Customer Service"
      service-types: '["Api","Worker"]'
      branch-name: ${{ case(github.head_ref == '', github.ref_name, github.head_ref) }}

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
    - uses: sming-code/build-test-action@v1

  build-docker-images:
    name: Build docker images
    runs-on: ubuntu-latest
    needs: [ variables, build-test ]
    strategy:
      fail-fast: true
      matrix:
        service-type: ${{ fromJson(needs.variables.outputs.service-types) }}
    steps:
    - uses: sming-code/build-docker-image-action@v1
      with:
        project-name-root: ${{ needs.variables.outputs.project-name-root }}
        image-name-root: ${{ needs.variables.outputs.app-name }}
        dockerfile-name-root: Dockerfile
        service-type: ${{ matrix.service-type }}
        version-number: ${{ needs.variables.outputs.version-no }}

  deploy-dev:
    name: Deploy container app and related resources to environments
    needs: [ variables, build-docker-images ]
    if: ${{ (github.ref == 'refs/heads/main') || (inputs.deploy-to-dev == true) }}
    uses: sming-code/deploy-container-app-to-environment-action/.github/workflows/deploy-container-app-to-environment-action.yml@v1
    with:
      environment: dev
      logical-area: ${{ needs.variables.outputs.logical-area }}
      app-name: ${{ needs.variables.outputs.app-name }}
      service-name: ${{ needs.variables.outputs.service-name }}
      version-no: ${{ needs.variables.outputs.version-no }}
      service-types: ${{ needs.variables.outputs.service-types }}
      branch-name: ${{ needs.variables.outputs.branch-name }}
      subscription: 'sub-tag-testing'
    secrets:
      ghcr-username: ${{ secrets.GHCR_USERNAME }}
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
      client-id: ${{ secrets.AZURE_CLIENT_ID_DEV }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID_DEV }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

  deploy-test:
    name: Deploy container app and related resources to environments
    needs: [ variables, deploy-dev ]
    if: ${{ (github.ref == 'refs/heads/main') }}
    uses: sming-code/deploy-container-app-to-environment-action/.github/workflows/deploy-container-app-to-environment-action.yml@v1
    with:
      environment: test
      logical-area: ${{ needs.variables.outputs.logical-area }}
      app-name: ${{ needs.variables.outputs.app-name }}
      service-name: ${{ needs.variables.outputs.service-name }}
      version-no: ${{ needs.variables.outputs.version-no }}
      service-types: ${{ needs.variables.outputs.service-types }}
      branch-name: ${{ needs.variables.outputs.branch-name }}
      subscription: 'sub-tag-testing'
    secrets:
      ghcr-username: ${{ secrets.GHCR_USERNAME }}
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
      client-id: ${{ secrets.AZURE_CLIENT_ID_TEST }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID_TEST }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_TEST }}

  deploy-prod:
    name: Deploy container app and related resources to environments
    needs: [ variables, deploy-test ]
    if: ${{ (github.ref == 'refs/heads/main') }}
    uses: sming-code/deploy-container-app-to-environment-action/.github/workflows/deploy-container-app-to-environment-action.yml@v1
    with:
      environment: prod
      logical-area: ${{ needs.variables.outputs.logical-area }}
      app-name: ${{ needs.variables.outputs.app-name }}
      service-name: ${{ needs.variables.outputs.service-name }}
      version-no: ${{ needs.variables.outputs.version-no }}
      service-types: ${{ needs.variables.outputs.service-types }}
      branch-name: ${{ needs.variables.outputs.branch-name }}
      subscription: 'sub-tag-testing'
    secrets:
      ghcr-username: ${{ secrets.GHCR_USERNAME }}
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
      client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID_PROD }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

  create-release:
    name: Create release
    needs: [ variables, deploy-prod ]
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/add-github-release.yaml
    with:
      version-number: ${{ needs.variables.outputs.version-no }}
      previous-tag: ${{ needs.variables.outputs.last-release-tag }}