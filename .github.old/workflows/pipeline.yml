name: Customer service pipeline.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy-to-dev:
        description: 'Deploy branch container to dev environment for testing'
        required: false
        type: boolean
        default: false
      log-level:
        description: Log level to use
        type: choice
        default: Warning
        options:
          - Trace
          - Debug
          - Information
          - Warning
          - Error
          - Critical
      reservation-svc-target-branch:
        description: Branch to target for Reservation Service api client
        type: choice
        options:
          - default
          - branch
        default: default
        required: true
      ppl-svc-target-branch:
        description: Branch to target for PPL Service api client
        type: choice
        options:
          - default
          - branch
        default: default
        required: true
      broken-svc-target-branch:
        description: Branch to target for Broken Service api client
        type: choice
        options:
          - default
          - branch
        default: default
        required: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  log-level: ${{ inputs.log-level }}

jobs:
  variables:
    name: Generate variables
    runs-on: ubuntu-latest
    steps:
    - uses: sming-code/get-version-no-action@v1
      id: get-version
      with:
        major: 1
        minor: 0
    outputs:
      version-no: ${{ steps.get-version.outputs.version-no }}
      last-release-tag: ${{ steps.get-version.outputs.last-release-tag }}

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
    - uses: sming-code/build-test-action@v1

  build-docker-images:
    name: Build docker images
    runs-on: ubuntu-latest
    needs: [ variables ]
    strategy:
      fail-fast: true
      matrix:
        service-type: [ Api,Worker ]
    steps:
    - uses: sming-code/build-docker-image-action@v1
      with:
        project-name-root: DemoApp.Services.Customers
        image-name-root: customer
        dockerfile-name-root: Dockerfile
        service-type: ${{ matrix.service-type }}
        version-number: ${{ needs.variables.outputs.version-no }}

  get-branch-suffix:
    name: Get branch suffix
    if: ${{ (github.ref == 'refs/heads/main') || (inputs.deploy-to-dev == true) }}
    runs-on: ubuntu-latest
    steps:
    - uses: sming-code/get-branch-suffix-action@v1
      id: get-suffix
      with:
        branch-name: ${{ case(github.head_ref == '', github.ref_name, github.head_ref) }}
    outputs:
      branch-suffix: ${{ steps.get-suffix.outputs.branch-suffix }}

  deploy-dev:
    name: Deploy container app and related resources to dev environment
    needs: [ variables, get-branch-suffix, build-docker-images  ]
    if: ${{ (github.ref == 'refs/heads/main') || (inputs.deploy-to-dev == true) }}
    uses: ./.github/workflows/deploy-container-app-to-environment.yml
    with:
      app-name: customer
      app-insights-name: insight-customer-dev${{ needs.get-branch-suffix.outputs.branch-suffix }}
      branch-suffix: ${{ needs.get-branch-suffix.outputs.branch-suffix }}
      container-app-environment-name: caenv-dev-tag-private
      environment-name: dev
      environment-resource-group-name: rg-dev-tag
      log-analytics-workspace-name: log-analytics-dev-tag
      resource-group-name: ${{ case(needs.get-branch-suffix.outputs.branch-suffix == '', 'rg-customer-dev', format('rg-dev{0}', needs.get-branch-suffix.outputs.branch-suffix)) }}
      sql-database-name:  sql-customer-dev${{ needs.get-branch-suffix.outputs.branch-suffix }}
      sql-server-name: dev-tag
      subscription: sub-tag-testing
      version-no: ${{ needs.variables.outputs.version-no }}
      reservation-svc-target-branch: ${{ case(inputs.reservation-svc-target-branch == 'default', '', format('-{0}', needs.get-branch-suffix.outputs.branch-suffix)) }}
      ppl-svc-target-branch: ${{ inputs.ppl-svc-target-branch }}
      broken-svc-target-branch: ${{ inputs.broken-svc-target-branch }}
    secrets:
      ghcr-username: ${{ secrets.GHCR_USERNAME }}
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
      client-id: ${{ secrets.AZURE_CLIENT_ID_DEV }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID_DEV }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_DEV }}

  deploy-test:
    name: Deploy container app and related resources to test environment
    needs: [ variables, get-branch-suffix, build-docker-images , deploy-dev ]
    if: ${{ (github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/deploy-container-app-to-environment.yml
    with:
      app-name: customer
      app-insights-name: insight-customer-test${{ needs.get-branch-suffix.outputs.branch-suffix }}
      branch-suffix: ${{ needs.get-branch-suffix.outputs.branch-suffix }}
      container-app-environment-name: caenv-test-tag-private
      environment-name: test
      environment-resource-group-name: rg-test-tag
      log-analytics-workspace-name: log-analytics-test-tag
      resource-group-name: ${{ case(needs.get-branch-suffix.outputs.branch-suffix == '', 'rg-customer-test', format('rg-test{0}', needs.get-branch-suffix.outputs.branch-suffix)) }}
      sql-database-name:  sql-customer-test${{ needs.get-branch-suffix.outputs.branch-suffix }}
      sql-server-name: test-tag
      subscription: sub-tag-testing
      version-no: ${{ needs.variables.outputs.version-no }}
      reservation-svc-target-branch: ${{ inputs.reservation-svc-target-branch }}
      ppl-svc-target-branch: ${{ inputs.ppl-svc-target-branch }}
      broken-svc-target-branch: ${{ inputs.broken-svc-target-branch }}
    secrets:
      ghcr-username: ${{ secrets.GHCR_USERNAME }}
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
      client-id: ${{ secrets.AZURE_CLIENT_ID_TEST }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID_TEST }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_TEST }}

  deploy-prod:
    name: Deploy container app and related resources to prod environment
    needs: [ variables, get-branch-suffix, build-docker-images , deploy-test ]

    uses: ./.github/workflows/deploy-container-app-to-environment.yml
    with:
      app-name: customer
      app-insights-name: insight-customer-prod${{ needs.get-branch-suffix.outputs.branch-suffix }}
      branch-suffix: ${{ needs.get-branch-suffix.outputs.branch-suffix }}
      container-app-environment-name: caenv-prod-tag-private
      environment-name: prod
      environment-resource-group-name: rg-prod-tag
      log-analytics-workspace-name: log-analytics-prod-tag
      resource-group-name: ${{ case(needs.get-branch-suffix.outputs.branch-suffix == '', 'rg-customer-prod', format('rg-prod{0}', needs.get-branch-suffix.outputs.branch-suffix)) }}
      sql-database-name:  sql-customer-prod${{ needs.get-branch-suffix.outputs.branch-suffix }}
      sql-server-name: prod-tag
      subscription: sub-tag-testing
      version-no: ${{ needs.variables.outputs.version-no }}
      reservation-svc-target-branch: ${{ inputs.reservation-svc-target-branch }}
      ppl-svc-target-branch: ${{ inputs.ppl-svc-target-branch }}
      broken-svc-target-branch: ${{ inputs.broken-svc-target-branch }}
    secrets:
      ghcr-username: ${{ secrets.GHCR_USERNAME }}
      ghcr-token: ${{ secrets.GHCR_TOKEN }}
      client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID_PROD }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

